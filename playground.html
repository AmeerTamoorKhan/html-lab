<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTMLab — Playground</title>
<link rel="stylesheet" href="shared.css">
<style>
.pg-wrap {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 54px);
}

.pg-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  background: var(--cream2);
  border-bottom: 2px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
}

.pg-title {
  font-family: var(--hand);
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--ink);
  margin-right: 8px;
}

.pg-btn {
  padding: 6px 14px;
  border-radius: 7px;
  font-family: var(--mono);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .15s;
}

.pg-btn-run {
  background: var(--teal);
  color: #fff;
  border: 2px solid var(--teal);
}
.pg-btn-run:hover {
  background: #23998a;
  border-color: #23998a;
}

.pg-btn-reset,
.pg-btn-copy {
  background: #fff;
  color: var(--ink3);
  border: 2px solid var(--border);
}
.pg-btn-reset:hover {
  border-color: var(--coral);
  color: var(--coral);
}
.pg-btn-copy:hover {
  border-color: var(--teal);
  color: var(--teal);
}

.pg-hint {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--ink3);
}
.pg-hint kbd {
  background: var(--cream);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 0.65rem;
}

.pg-editors {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  flex: 1;
  overflow: hidden;
}

.pg-pane {
  display: flex;
  flex-direction: column;
  border-right: 2px solid var(--border);
  overflow: hidden;
}
.pg-pane:last-child {
  border-right: none;
}

.pg-pane-header {
  padding: 7px 14px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: var(--mono);
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.ph-html {
  background: #2a2520;
  color: #f06449;
  border-bottom: 1px solid #3d3530;
}
.ph-css {
  background: #2a2520;
  color: #4a7fc1;
  border-bottom: 1px solid #3d3530;
}
.ph-prev {
  background: var(--cream2);
  color: var(--ink3);
  border-bottom: 1px solid var(--border);
}

.pg-pane-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.pg-editor {
  flex: 1;
  resize: none;
  border: none;
  background: #1a1612;
  color: #e8ddd4;
  font-family: var(--mono);
  font-size: 0.8rem;
  line-height: 1.65;
  padding: 14px;
  tab-size: 2;
}
.pg-editor:focus {
  background: #141210;
  outline: 2px solid var(--teal);
  outline-offset: -2px;
}

.pg-preview {
  flex: 1;
  background: #fff;
}
.pg-preview iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

.live-badge {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 3px;
  font-size: 0.58rem;
  color: var(--teal);
  font-weight: 700;
}
.live-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--teal);
  animation: blink 1.5s infinite;
}
@keyframes blink {
  0%,100% { opacity: 1; }
  50% { opacity: .25; }
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--ink);
  color: var(--cream);
  padding: 8px 20px;
  border-radius: 8px;
  font-family: var(--mono);
  font-size: 0.75rem;
  font-weight: 600;
  transition: transform .25s ease;
  z-index: 999;
  pointer-events: none;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
}

@media (max-width: 1000px) {
  .pg-editors {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr 1fr 1.2fr;
  }
  .pg-pane {
    border-right: none;
    border-bottom: 2px solid var(--border);
  }
  .pg-pane:last-child {
    border-bottom: none;
  }
}
</style>
</head>
<body>
<nav id="topnav">
  <div class="logo"><a href="index.html">HTML<span>ab</span> ✏️</a></div>
  <div class="nav-links">
    <a class="nav-link" href="index.html">📚 Learn</a>

    <button class="pg-btn pg-btn-copy" id="btn-copy">⎘ Copy HTML</button>
    <span class="pg-hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> to run</span>

  <div class="pg-editors">

        <div class="pg-pane-dot" style="background:#2bb5a0"></div>Live Preview
        <div class="live-badge"><div class="live-dot"></div>LIVE</div>
      </div>
      <div class="pg-preview">
        <iframe id="pg-frame" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>

</div>

<div class="toast" id="toast">Copied to clipboard!</div>

<script>
var DEFAULT_HTML = `<header class="site-header">

  <section id="form-demo" class="card">
    <h3>Form Example</h3>
    <form onsubmit="event.preventDefault(); alert('Form submitted!');">

        <div>

        <div>
          <label for="topic">Topic</label>

        <div>

  <section id="media" class="grid-two">

<footer id="footer" class="site-footer">

var DEFAULT_CSS = `* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: Georgia, serif;
  background: #faf7f2;
  color: #1a1612;
  line-height: 1.6;
}

.container {
  width: min(1100px, calc(100% - 32px));
  margin: 0 auto;
}

.site-header {
  background: linear-gradient(135deg, #1a1612, #3d3530);
  color: #faf7f2;
  padding: 48px 0 28px;
}

.site-header h1 {
  margin: 0 0 8px;
  font-size: 2.2rem;

.subtitle {
  margin: 0 0 18px;

.main-nav {

  flex-wrap: wrap;

  font-weight: 700;

main {

var htmlEl = document.getElementById('pg-html');
var cssEl = document.getElementById('pg-css');
var frame = document.getElementById('pg-frame');
var toast = document.getElementById('toast');

htmlEl.value = DEFAULT_HTML;
cssEl.value = DEFAULT_CSS;

function run() {
  var doc =
    '<!DOCTYPE html>' +
    '<html lang="en">' +
    '<head>' +
    '<meta charset="UTF-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<style>' + cssEl.value + '</style>' +
    '</head>' +
    '<body>' + htmlEl.value + '</body>' +
    '</html>';

  frame.srcdoc = doc;
}

run();
htmlEl.addEventListener('input', run);
cssEl.addEventListener('input', run);
document.getElementById('btn-run').addEventListener('click', run);

document.getElementById('btn-reset').addEventListener('click', function() {
  if (confirm('Reset to default code?')) {
    htmlEl.value = DEFAULT_HTML;
    cssEl.value = DEFAULT_CSS;
    run();
  }
});

document.getElementById('btn-copy').addEventListener('click', function() {
  var full =
`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Page</title>
<style>
${cssEl.value}
</style>
</head>
<body>
${htmlEl.value}
</body>
</html>`;

  navigator.clipboard.writeText(full).then(function() {
    toast.classList.add('show');
    setTimeout(function() {
      toast.classList.remove('show');
    }, 2200);
  });
});

document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    run();
  }

  if (e.key === 'Tab' && (e.target === htmlEl || e.target === cssEl)) {
    e.preventDefault();
    var t = e.target;
    var start = t.selectionStart;
    var end = t.selectionEnd;
    t.value = t.value.substring(0, start) + '  ' + t.value.substring(end);
    t.selectionStart = t.selectionEnd = start + 2;
  }
});
</script>
</body>
</html>
